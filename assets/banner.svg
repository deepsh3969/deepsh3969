<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Deepesh Chaurasia - Full-stack and AI computer vision developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3a7"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <rect x="-320" y="0" width="260" height="300" fill="url(#shine)" transform="skewX(-16)">
    <animate attributeName="x" from="-320" to="1260" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="4" fill="url(#accent)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="88" font-size="16" letter-spacing="4" fill="#36bcf7" font-family="Consolas, 'Courier New', monospace">GITHUB.COM/DEEPSH3969</text>

    <text x="64" y="146" font-size="46" font-weight="700" fill="url(#namegrad)">Deepesh Chaurasia</text>

    <text x="64" y="184" font-size="20" fill="#9fb0c3">Full-Stack Developer  ·  AI &amp; Computer Vision</text>

    <g font-size="14" text-anchor="middle">
      <rect x="64"  y="212" width="72"  height="30" rx="15" fill="#36bcf7" fill-opacity="0.12" stroke="#36bcf7" stroke-opacity="0.45"/>
      <text x="100" y="232" fill="#36bcf7">React</text>

      <rect x="146" y="212" width="106" height="30" rx="15" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.45"/>
      <text x="199" y="232" fill="#b9a6ff">TypeScript</text>

      <rect x="262" y="212" width="84"  height="30" rx="15" fill="#22d3a7" fill-opacity="0.12" stroke="#22d3a7" stroke-opacity="0.45"/>
      <text x="304" y="232" fill="#5fe3c0">Python</text>

      <rect x="356" y="212" width="86"  height="30" rx="15" fill="#009688" fill-opacity="0.14" stroke="#009688" stroke-opacity="0.5"/>
      <text x="399" y="232" fill="#63d9cf">FastAPI</text>

      <rect x="452" y="212" width="76"  height="30" rx="15" fill="#2496ed" fill-opacity="0.14" stroke="#2496ed" stroke-opacity="0.5"/>
      <text x="490" y="232" fill="#7ec4ff">Docker</text>
    </g>
  </g>

  <g>
    <rect x="740" y="50" width="400" height="200" rx="14" fill="#0d1117" stroke="#1f2a3a" stroke-width="1.5"/>

    <circle cx="766" cy="76" r="5" fill="#ff5f56"/>
    <circle cx="784" cy="76" r="5" fill="#ffbd2e"/>
    <circle cx="802" cy="76" r="5" fill="#27c93f"/>
    <text x="822" y="81" font-size="13" fill="#6e7681" font-family="Consolas, 'Courier New', monospace">profile.ts</text>

    <line x1="740" y1="96" x2="1140" y2="96" stroke="#1f2a3a" stroke-width="1.5"/>

    <g font-size="15" font-family="Consolas, 'Courier New', monospace">
      <text x="764" y="126" fill="#ff7b72">const dev = {</text>
      <text x="764" y="151" fill="#a5d6ff">  name: "Deepesh",</text>
      <text x="764" y="176" fill="#7ee787">  stack: ["React", "AI"],</text>
      <text x="764" y="201" fill="#d2a8ff">  learning: true,</text>
      <text x="764" y="226" fill="#ff7b72">}</text>
    </g>

    <rect x="777" y="214" width="9" height="16" fill="#36bcf7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
